# This is a fixture/template, not real data -- copy it to device-playlist.toml
# (gitignored) and edit that instead. Never commit your real playlist here.
#
# Use-editable. Keys are always Semantic (names you chose), values are always
# Gutenberg (whatever the transport resolves to) -- never the reverse.
# See README.md #2 "The device-playlist file format" for the full rule.
#
# Never put a credential or key directly in this file, even in your private
# copy. Reference the name of an environment variable instead (see the
# mqtt-broker example below) and put the real value in a gitignored .env
# file, loaded with `node --env-file=.env`. See README.md #2 "Secrets never
# go in the playlist" for the full rule.

myHpPrinter.transport = "mdns"
myHpPrinter.address   = "printer.local"

mqtt-broker.transport     = "mdns"
mqtt-broker.address       = "_mqtt._tcp.local"
mqtt-broker.password_env  = "MQTT_BROKER_PASSWORD"

# Router-assigned via DHCP+DNS (dnsmasq-style), not mDNS -- regular
# unicast DNS to whatever server this machine already uses, normally the
# router itself. See README.md "Extending to router-assigned local DNS
# names".
raspi3.transport = "dns"
raspi3.address   = "raspi3.home"

# Dirigera hub connection config (hostname, bearer token) lives in .env --
# DIRIGERA_HOSTNAME, DIRIGERA_BEARER_TOKEN -- not here. See README.md
# "Extending to vendor-hub REST APIs".
kitchen-lamp.transport = "dirigera"
kitchen-lamp.address   = "<dirigera-device-id>"

# Optional, per device: narrow display-fields/dirigera.toml's `light`
# catalog down to just the lines this device cares about -- an allow-list
# (only these labels show) or a deny-list (everything except these), never
# both on the same device (the allow-list wins if both are set). Neither
# key: every catalog line shows, the default. See README.md "Flattening
# nested readings for display".
# hallway-lamp.transport           = "dirigera"
# hallway-lamp.address             = "<dirigera-device-id>"
# hallway-lamp.displayFields       = ["On"]
# another-lamp.transport           = "dirigera"
# another-lamp.address             = "<dirigera-device-id>"
# another-lamp.excludeDisplayFields = ["Brightness"]

# Ecowitt is a cloud API (ECOWITT_APPLICATION_KEY, ECOWITT_API_KEY in
# .env), not a local hub like Dirigera -- see README.md "Extending to
# cloud vendor APIs" for why that's a real, honestly-stated difference.
weather-station.transport = "ecowitt"
weather-station.address   = "<device-mac>"

# Smartbridge/ICS2000 (KlikAanKlikUit's cloud, SMARTBRIDGE_EMAIL /
# SMARTBRIDGE_MAC / SMARTBRIDGE_PASSWORD_HASH in .env) -- meta carries
# version_status/version_data as real change-detection signals; the
# device's actual state (data/status) is encrypted ciphertext with no
# known decryption, passed through opaque rather than guessed at.
kaku-plug.transport = "smartbridge"
kaku-plug.address   = "<ics2000-device-id>"

# Raw WebUSB -- address is "vvvv:pppp" (hex vendorId:productId, the same
# pair lsusb/Device Manager show). No standard interface to resolve a name
# against the way BLE GATT has, so interfaceNumber/endpointNumber are named
# explicitly. See README.md "Extending to WebUSB and WebHID".
usb-widget.transport      = "usb"
usb-widget.address        = "1a86:7523"
usb-widget.interfaceNumber = 0
usb-widget.endpointNumber  = 1

# WebHID -- same "vvvv:pppp" address shape as usb-widget above, but reached
# via navigator.hid instead of navigator.usb. This is also how a *Bluetooth*
# HID device is reached from a browser at all, since Web Bluetooth excludes
# the HID-over-GATT service on purpose -- see README.md "Extending to
# WebUSB and WebHID".
game-controller.transport = "hid"
game-controller.address   = "0079:0011"

# transport: "ble-gatt" -- read via a real meterkast-proxy ESP32 board
# (proxyUrl), not this machine's own local BLE. All device-specific
# knowledge (which UUIDs, which decode math) lives in
# src/adapters/ble-gatt-profiles.js, keyed by deviceType -- the ESP32's
# own firmware knows nothing about either device below, only "connect and
# read this characteristic" / "here are the raw advertisement bytes". See
# README.md "Extending to BLE GATT via a proxy board".
#
# "bthome-v2": an advertisement-only device (pvvx ATC_MiThermometer custom
# firmware, or anything else broadcasting BTHome v2) -- no GATT connection
# at all, just the raw service-data bytes the proxy's passive scan already
# captures every cycle. address is the device's real MAC.
living-room-thermometer.transport = "ble-gatt"
living-room-thermometer.address   = "A4:C1:38:AA:BB:CC"
living-room-thermometer.deviceType = "bthome-v2"
living-room-thermometer.proxyUrl   = "http://192.168.1.52"

# "sig-thermometer": a standard Bluetooth SIG Health Thermometer GATT
# profile -- the proxy connects, reads the Temperature Measurement
# characteristic, and disconnects each cycle.
stock-xiaomi-thermometer.transport = "ble-gatt"
stock-xiaomi-thermometer.address   = "C4:7C:8D:11:22:33"
stock-xiaomi-thermometer.deviceType = "sig-thermometer"
stock-xiaomi-thermometer.proxyUrl   = "http://192.168.1.52"

# "mibeacon": a second real device, this one currently in Xiaomi's native
# Mi Home advertising mode rather than pvvx custom mode -- same custom
# ATC firmware (name still reads "ATC_..."), just a different advertising
# format selected on it. Nothing stops the same deviceType from being
# reused across as many playlist entries as there are real devices
# speaking it.
koelkast-thermometer.transport = "ble-gatt"
koelkast-thermometer.address   = "A4:C1:38:70:D9:33"
koelkast-thermometer.deviceType = "mibeacon"
koelkast-thermometer.proxyUrl   = "http://192.168.1.174"

# A third "mibeacon" device, a real Xiaomi Mi Flora ("Flower care") plant
# sensor -- same deviceType/profile, different real product entirely
# (its own Product ID, its own object set: illuminance/moisture/
# conductivity rather than temperature/humidity). No GATT connection at
# all -- this is the same passive-advertisement path as the two
# thermometers above, and turned out to be the only thing needed for
# real plant readings; a separate GATT write-trigger attempt against
# this same device's real-time-data characteristic never actually
# worked (see meterkast-proxy's own README).
flower-care.transport = "ble-gatt"
flower-care.address   = "C4:7C:8D:65:D2:D3"
flower-care.deviceType = "mibeacon"
flower-care.proxyUrl   = "http://192.168.1.174"

# Two kinds of entry drop devices from every BLE discovery screen
# (proxy-scanned and this machine's own Windows Bluetooth alike). This
# lives here, not on the ESP32: the proxy board still sees and reports
# these devices, they're just filtered out of "what's new" before you'd
# ever have to look at them. See README.md "BLE discovery blacklist".
#
# - A bare entry is an address prefix (or full address) -- e.g. a
#   neighbor's solar inverter that keeps showing up in scans.
# - A "uuid:XXXX" entry matches by advertisement service-data UUID
#   instead -- the only real fix for a device using genuinely rotating
#   private addresses, like Android's crowdsourced "Find My Device"
#   network beacon (0xfef3, real Google-registered UUID) -- no fixed
#   address prefix could ever catch that one. proxy-adapter.js's own
#   discover response tags each candidate with a serviceDataUuidCounts
#   field (how many currently-visible devices share each of its UUIDs)
#   specifically to help decide whether a UUID is common/noisy enough to
#   be worth a "uuid:" entry.
bleIgnore = ["DE:AD:BE:EF:00:", "uuid:fef3"]

# Everything above this line is a flat dotted-key entry -- has to stay
# that way, and in this position: TOML has no way to "return to root"
# once a [table] header appears below, so every later bare/dotted
# assignment (including another one-off `bleIgnore = [...]` or a new
# flat device) would silently nest *inside* the most recent table
# instead of landing at the top level. Add new flat entries above this
# comment, not after it. (This bit a real copy of this exact file before
# it was caught -- five ble-gatt entries and bleIgnore itself had been
# silently swallowed into kitchen-thermometer.readings.*, parsing
# without error and just quietly not doing anything. flattenDeviceReadings
# has no way to tell "misplaced" from "intentional" -- TOML's own syntax
# doesn't distinguish them either.)

# Nested devices+readings, flattened at load time into
# kitchen-thermometer-temperature / kitchen-thermometer-battery -- see
# README.md "Extending to BLE GATT characteristics".
[devices.kitchen-thermometer]
transport = "bluetooth"
address   = "AA:BB:CC:DD:EE:FF"

[devices.kitchen-thermometer.readings]
temperature = { service = "health-thermometer", characteristic = "temperature-measurement" }
battery     = { service = "battery-service",     characteristic = "battery-level" }

# "atc-pvvx": ATC1441/pvvx custom thermometer firmware's own native
# advertisement format (service data UUID 0x181a) -- the richest of the
# advertisement profiles for a device running this firmware: temperature,
# humidity, battery percent, and battery voltage all arrive in one packet
# every cycle. This same real device also broadcasts Xiaomi's native
# MiBeacon format concurrently under 0xfe95 (deviceType "mibeacon") --
# either works, atc-pvvx just needs no round-robin wait for a full
# reading.
#
# Written in the nested [devices.*] form (no `readings` sub-table --
# flattenDeviceReadings emits it as one flat record under its own name,
# same as a dotted-key entry would, see README.md "Extending to
# time-scoped device aliases") purely to carry [[...aliases]], which
# TOML's array-of-tables syntax has no flat dotted-key equivalent for.
#
# The scenario: this device was physically swapped for a replacement
# unit (battery died, board got re-flashed, whatever the real reason) --
# same Semantic name, same physical spot in the garage, but a brand new
# real MAC as of 2026-06-01. Rather than silently going stale the moment
# the old MAC stopped advertising, both addresses are declared as
# time-scoped aliases of the one canonical name: the old one bounded by
# `validTo` (no longer resolves after that date), the new one open-ended
# (`validTo` omitted = still current). See README.md "Extending to
# time-scoped device aliases" and src/core/identity-resolver.js for the
# resolution rules (unknown/resolved/ambiguous).
[devices.garage-thermometer]
transport  = "ble-gatt"
deviceType = "atc-pvvx"
proxyUrl   = "http://192.168.1.52"

[[devices.garage-thermometer.aliases]]
type      = "mac"
value     = "A4:C1:38:F2:8A:E1"
validFrom = "2026-01-01"
validTo   = "2026-06-01"

[[devices.garage-thermometer.aliases]]
type      = "mac"
value     = "A4:C1:38:F2:8A:FA"
validFrom = "2026-06-01"
# validTo omitted = still current

# A NAS box whose hostname changed after being renamed in its own admin
# UI (wd-mycloud -> wd-mycloud-nas) -- the same "raw identifier isn't a
# permanent fact" problem BLE's rotating MACs have, just for an mDNS
# hostname instead. Same nested-form reasoning as garage-thermometer
# above (no `readings`, purely to carry `[[...aliases]]`). Unlike
# ble-gatt-proxy-adapter.js's advertisement-scan path, mDNS resolution
# (local or via proxy) always needs one definite hostname to query
# *before* anything comes back -- mdns-adapter.js picks it with
# `currentAliasValue`, a forward resolve, never a reverse scan-and-match
# against a list of everything currently visible. See README.md
# "Extending to time-scoped device aliases".
[devices.wd-mycloud]
transport = "mdns"

[[devices.wd-mycloud.aliases]]
type      = "hostname"
value     = "wd-mycloud.local"
validFrom = "2026-01-01"
validTo   = "2026-07-01"

[[devices.wd-mycloud.aliases]]
type      = "hostname"
value     = "wd-mycloud-nas.local"
validFrom = "2026-07-01"
# validTo omitted = still current
